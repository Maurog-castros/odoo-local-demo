services:
  # ─────────────────────────────────────────────
  # PostgreSQL 15
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: odoo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: odoo_demo_19
      POSTGRES_USER: odoo_user
      POSTGRES_PASSWORD: odoo_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_19:/var/lib/postgresql/data
    networks:
      - odoo_network

  # ─────────────────────────────────────────────
  # Odoo Backend (servidor de aplicaciones)
  # ─────────────────────────────────────────────
  odoo:
    image: odoo:19.0-20260926
    container_name: odoo-backend
    restart: unless-stopped
    command: ["odoo", "--database=odoo_demo_19", "--init=base,iso_demo", "--without-demo=True"]
    depends_on:
      - postgres
    ports:
      - "8069:8069"
    environment:
      - host=postgres
      - port=5432
      - user=odoo_user
      - password=odoo_pass
      - database=odoo_demo_19
      - admin_password=Admin123
    volumes:
      - ./odoo.conf:/etc/odoo/odoo.conf:ro
      - ./my_addons:/mnt/addons
      - odoo_data_19:/var/lib/odoo
    networks:
      - odoo_network

  # ─────────────────────────────────────────────
  # Nginx (reverse proxy / frontend)
  # ─────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: odoo-frontend
    restart: unless-stopped
    depends_on:
      - odoo
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - odoo_network

# ──────────────────────────────────────────────
# Volumes & Networks
# ──────────────────────────────────────────────
volumes:
  postgres_data_19:
  odoo_data_19:

networks:
  odoo_network:
    driver: bridge
